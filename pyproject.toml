[project]
name = "uta-gestion-ops"
version = "0.1.0"
description = "An application to manage payment orders for UTA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "nicegui>=3.0.4",
    "pywebview>=6.0",
    "sqlalchemy>=2.0.44",
    "weasyprint>=66.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.4",
]

packaging = ["pyinstaller>=6.16.0"]

[tool.uv]
default-groups = "all"